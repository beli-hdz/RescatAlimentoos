; Subidas: la app permite hasta 8 archivos de 10 MB por donación
upload_max_filesize = 12M
post_max_size = 100M
max_file_uploads = 20
memory_limit = 256M

; Errores a los logs, no a la pantalla
display_errors = Off
log_errors = On

; Sesiones más seguras
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
expose_php = Off
