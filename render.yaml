services:
  - type: web
    name: rescat-alimentos
    runtime: docker
    plan: free
    healthCheckPath: /login.php
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: rescat_alimentos
      - key: APP_TIMEZONE
        value: America/Monterrey
      - key: ADMIN_NAME
        value: Administrador
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
